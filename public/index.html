<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ogm-light</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="theme-color" content="#181420">
<link rel="stylesheet" href="vendor/rpg-awesome/css/rpg-awesome.min.css?v=1">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <!-- login -->
  <section id="login" class="screen">
    <h1>ogm-light</h1>
    <form id="login-form">
      <input id="login-user" name="username" placeholder="username" autocomplete="username" required>
      <input id="login-pass" name="password" type="password" placeholder="password" autocomplete="current-password" required>
      <button type="submit"><i class="ra ra-crossed-swords" aria-hidden="true"></i> Play</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- campaign picker -->
  <section id="home" class="screen" hidden>
    <header class="bar"><h2>Tables</h2><button id="logout" class="btn-logout"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>Log out</button></header>
    <div id="campaign-list"></div>
  </section>

  <!-- table -->
  <section id="table" class="screen" hidden>
    <header class="bar">
      <button id="back" class="btn-icon" aria-label="Back to tables"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg></button>
      <h2 id="table-title">…</h2>
      <div class="bar-actions">
        <button id="tts-toggle" class="btn-icon" aria-label="Narration voice" title="Narration voice">
          <span class="ic-off"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/></svg></span>
          <span class="ic-on"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/></svg></span>
        </button>
        <button id="sheet-toggle" class="btn-icon" aria-label="Character sheet" title="Character sheet"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/></svg></button>
      </div>
    </header>
    <div id="transcript" aria-live="polite"></div>
    <div id="new-msgs" hidden><button><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"/></svg> new</button></div>
    <form id="composer">
      <div class="seg" role="tablist">
        <button type="button" data-kind="do" class="on"><i class="ra ra-sword" aria-hidden="true"></i>do</button>
        <button type="button" data-kind="say"><i class="ra ra-speech-bubble" aria-hidden="true"></i>say</button>
        <button type="button" data-kind="ooc"><i class="ra ra-speech-bubbles" aria-hidden="true"></i>ooc</button>
      </div>
      <div class="row">
        <textarea id="action-text" rows="1" placeholder="What do you do?" enterkeyhint="send"></textarea>
        <button id="send" type="submit" aria-label="Send"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/></svg></button>
      </div>
    </form>
    <aside id="sheet" hidden></aside>
  </section>

  <script src="app.js?v=4"></script>
</body>
</html>
