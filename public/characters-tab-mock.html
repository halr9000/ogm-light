<!doctype html>
<!-- characters-tab-mock: second tab beside Tables, view-only — throwaway mock, not shipped -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ogm-light · characters tab mock</title>
<link rel="stylesheet" href="/vendor/rpg-awesome/css/rpg-awesome.min.css">
<style>
  :root {
    --bg: #14120f; --panel: #1c1915; --text: #e8e2d5; --dim: #8d8577;
    --accent: #c9a35c; --danger: #b04a3a; --ok: #6b8f6b;
    --serif: 'Lora', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px;
         padding: calc(env(safe-area-inset-top) + 8px) 14px 8px;
         background: var(--panel); border-bottom: 1px solid #2a2620; }
  .wordmark { margin: 0; flex: 1; font-family: var(--serif); font-size: 1.06rem; line-height: 1.2; }
  .wordmark .ogm { font-weight: 600; letter-spacing: 0.06em; color: var(--accent); }
  .wordmark .light { font-style: italic; font-weight: 500; color: var(--dim); letter-spacing: 0.01em; }
  .btn-icon { border: 0; background: none; color: var(--dim); padding: 6px; cursor: pointer; }
  .btn-icon svg { width: 22px; height: 22px; }
  .btn-logout { display: inline-flex; align-items: center; gap: 6px; color: var(--dim);
                font-size: 0.875rem; background: none; border: 0; cursor: pointer; }
  .btn-logout svg { width: 16px; height: 16px; }

  /* tabs: two panes, swipe or tap */
  .tabs { display: flex; background: var(--panel); border-bottom: 1px solid #2a2620; }
  .tabs button { flex: 1; padding: 10px 0 9px; background: none; border: 0; cursor: pointer;
                 color: var(--dim); font: 600 0.9rem var(--serif); letter-spacing: 0.02em; }
  .tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .viewport { flex: 1; overflow: hidden; position: relative; }
  .panes { position: absolute; inset: 0; display: flex; width: 200%; transform: translateX(0); transition: transform 0.22s ease; }
  .panes.drag { transition: none; }
  .pane { width: 50%; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }

  .campaign-card, .char-card { text-align: left; background: var(--panel); border: 1px solid #2a2620;
                   border-radius: var(--radius); padding: 14px; color: var(--text); font: inherit; }
  .campaign-card b { font-family: var(--serif); font-weight: 600; display: block; }
  .campaign-card .who { display: flex; align-items: center; gap: 7px; margin-top: 6px;
                        color: var(--text); font-size: 0.875rem; }
  .campaign-card .who i { color: var(--accent); font-size: 1rem; }
  .campaign-card .who .cls { color: var(--dim); }

  /* characters: view-only rows */
  .char-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .char-card > i { color: var(--accent); font-size: 1.5rem; }
  .char-card .mid { flex: 1; min-width: 0; }
  .char-card .name { font-family: var(--serif); font-weight: 600; }
  .char-card .meta { color: var(--dim); font-size: 0.8rem; margin-top: 2px; }
  .char-card .meta b { color: var(--dim); font-weight: 500; }
  /* the one way out to the full app: gold pencil chip, opens a new tab */
  .edit-link { flex: none; display: inline-flex; align-items: center; justify-content: center;
               width: 34px; height: 34px; border-radius: 9px;
               color: var(--accent); background: #262219; text-decoration: none; }
  .edit-link svg { width: 16px; height: 16px; }
  .edit-link:active { background: var(--accent); color: #14120f; }

  footer { display: flex; flex-direction: column; align-items: center; gap: 7px;
           padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
           background: var(--panel); border-top: 1px solid #2a2620; }
  footer .row { display: flex; align-items: center; gap: 20px; font-size: 0.9rem; }
  footer a { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  footer a:active { color: var(--accent); }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
               box-shadow: 0 0 0 0 rgba(107,143,107,0.5); animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(107,143,107,0.45); }
                     70% { box-shadow: 0 0 0 6px rgba(107,143,107,0); }
                     100% { box-shadow: 0 0 0 0 rgba(107,143,107,0); } }
  .conn .host { color: var(--dim); }
  footer .credit { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 0.8rem; }
  footer .credit img { width: 16px; height: 16px; border-radius: 4px; display: block; }
  footer .credit a { color: var(--text); gap: 5px; font-size: 0.8rem; }
  footer .credit a span { font-family: var(--serif); }
</style>
</head>
<body>

<script>
// swipe between the two panes; tab taps snap to them
const panes = document.getElementById('panes');
const tabs = [...document.querySelectorAll('.tabs button')];
function go(i) { panes.style.transform = `translateX(-${i * 50}%)`;
                 tabs.forEach((t, k) => t.setAttribute('aria-selected', String(k === i))); }
tabs.forEach(t => t.addEventListener('click', () => go(+t.dataset.pane)));
let x0 = null;
panes.addEventListener('pointerdown', e => { x0 = e.clientX; panes.classList.add('drag'); });
panes.addEventListener('pointerup', e => {
  if (x0 === null) return;
  const dx = e.clientX - x0; x0 = null; panes.classList.remove('drag');
  const cur = panes.style.transform.includes('-50%') ? 1 : 0;
  if (dx < -40 && cur === 0) go(1);
  if (dx > 40 && cur === 1) go(0);
});
</script>
</body>
</html>
