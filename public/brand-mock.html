<!doctype html>
<!-- brand-mock: tables-view footer branding — throwaway mock, not shipped -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ogm-light · brand mock</title>
<link rel="stylesheet" href="/vendor/rpg-awesome/css/rpg-awesome.min.css">
<style>
  :root {
    --bg: #14120f; --panel: #1c1915; --text: #e8e2d5; --dim: #8d8577;
    --accent: #c9a35c; --danger: #b04a3a; --ok: #6b8f6b;
    --serif: 'Lora', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px;
         padding: calc(env(safe-area-inset-top) + 8px) 14px 8px;
         background: var(--panel); border-bottom: 1px solid #2a2620; }
  .wordmark { margin: 0; flex: 1; font-family: var(--serif); font-size: 1.06rem; line-height: 1.2; }
  .wordmark .ogm { font-weight: 600; letter-spacing: 0.06em; color: var(--accent); }
  .wordmark .light { font-style: italic; font-weight: 500; color: var(--dim); letter-spacing: 0.01em; }
  .btn-icon { border: 0; background: none; color: var(--dim); padding: 6px; cursor: pointer; }
  .btn-icon svg { width: 22px; height: 22px; }
  .btn-logout { display: inline-flex; align-items: center; gap: 6px; color: var(--dim);
                font-size: 0.875rem; background: none; border: 0; cursor: pointer; }
  .btn-logout svg { width: 16px; height: 16px; }

  #campaign-list { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
  .campaign-card { text-align: left; background: var(--panel); border: 1px solid #2a2620;
                   border-radius: var(--radius); padding: 14px; color: var(--text); font: inherit; }
  .campaign-card b { font-family: var(--serif); font-weight: 600; display: block; }
  .campaign-card .who { display: flex; align-items: center; gap: 7px; margin-top: 6px;
                        color: var(--text); font-size: 0.875rem; }
  .campaign-card .who i { color: var(--accent); font-size: 1rem; }
  .campaign-card .who .cls { color: var(--dim); }
  .campaign-card .who .srv { margin-left: auto; color: var(--dim); font-size: 0.8rem; }

  /* the new footer: line 1 = our chrome, line 2 = quiet attribution */
  footer { display: flex; flex-direction: column; align-items: center; gap: 7px;
           padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
           background: var(--panel); border-top: 1px solid #2a2620; }
  footer .row { display: flex; align-items: center; gap: 20px; font-size: 0.9rem; }
  footer a { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  footer a:active { color: var(--accent); }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
               box-shadow: 0 0 0 0 rgba(107,143,107,0.5); animation: pulse 2.6s ease-out infinite; }
  footer.offline .dot { background: var(--danger); box-shadow: none; animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(107,143,107,0.45); }
                     70% { box-shadow: 0 0 0 6px rgba(107,143,107,0); }
                     100% { box-shadow: 0 0 0 0 rgba(107,143,107,0); } }
  .conn .host { color: var(--dim); }
  footer .credit { display: flex; align-items: center; gap: 7px;
                   color: var(--dim); font-size: 0.8rem; }
  footer .credit img { width: 16px; height: 16px; border-radius: 4px; display: block; }
  footer .credit a { color: var(--text); gap: 5px; font-size: 0.8rem; }
  footer .credit a span { font-family: var(--serif); }
  footer .gh svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <header class="bar">
    <h1 class="wordmark"><span class="ogm">OGM</span> <span class="light">light</span></h1>
    <button class="btn-icon" aria-label="Settings" title="Settings"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1-.083.899c-.07.553-.09 1.11-.09 1.667 0 .563.09 1.12.09 1.667 0 .557-.02 1.114-.09 1.667-.04.386-.137.758-.43.992l-1.004.827a1.125 1.125 0 0 1-1.37.49l-1.217-.456c-.355-.133-.75-.072-1.075.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.111-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.075-.124l-1.217.456a1.125 1.125 0 0 1-1.37-.49l-1.296-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 .083-.9c.07-.554.09-1.111.09-1.668 0-.556-.02-1.113-.09-1.667-.04-.386-.137-.758-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.431l1.296-2.247a1.125 1.125 0 0 1 1.37-.49l1.217.456c.355.132.75.072 1.075-.124.073-.04.147-.084.22-.128.332-.184.582-.496.644-.87l.213-1.281Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg></button>
    <button class="btn-logout">Log out</button>
  </header>
  <div id="campaign-list">
    <button class="campaign-card">
      <b>OGML UI Test</b>
      <span class="who"><i class="ra ra-plain-dagger" aria-hidden="true"></i>Vex&nbsp;<span class="cls">· rogue</span></span>
    </button>
    <button class="campaign-card">
      <b>Curse of Strahd</b>
      <span class="who"><i class="ra ra-crystal-ball" aria-hidden="true"></i>Wren&nbsp;<span class="cls">· wizard</span></span>
    </button>
  </div>
  <footer id="foot">
    <div class="row">
      <a class="conn" href="http://ogmhost.example:3005" title="Open the full OGM">
        <span class="dot" aria-hidden="true"></span>server&nbsp;<span class="host">ogmhost</span><
      </a>
      <a class="gh" href="https://github.com/halr9000/ogm-light" title="ogm-light on GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub
      </a>
    </div>
    <div class="credit">made possible by
      <a href="https://opengamemaster.com" title="Open Game Master website">
        <img src="https://opengamemaster.com/assets/img/icon-512.png" alt="" width="16" height="16"><span>Open&nbsp;Game&nbsp;Master</span>
      </a>
    </div>
  </footer>
</body>
</html>
